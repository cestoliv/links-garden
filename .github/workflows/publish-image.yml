name: publish image

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  # Never cancel a publish in flight: a multi-arch manifest half-pushed by a cancelled run
  # would leave `latest` pointing at a broken image.
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in token; no extra secret needed
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3 # emulation for the arm64 leg of the multi-arch build
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only from main, so a version tag never overwrites it; the commit sha tag is
      # always added, so any push (branch or tag) can be rolled back to by digest-independent name.
      - name: Resolve image tags
        id: meta
        run: |
          IMAGE=ghcr.io/cestoliv/links-garden
          TAGS="$IMAGE:sha-$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,$IMAGE:${{ github.ref_name }}"
          fi
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
