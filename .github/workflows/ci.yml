name: CI

on:
  push:
  pull_request:
  workflow_call: {} # lets publish-image.yml gate the image build on these same two jobs

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check --output-format=github src tests
      - run: uv run complexipy src tests
      - run: uv run mypy
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        # `tsc -b`, not `tsc --noEmit`: tsconfig.json is a solution file (`"files": []` plus
        # `references`), so plain `tsc --noEmit` resolves zero input files and passes on any
        # error at all. Build mode follows the references and actually checks the sources.
      - run: npx tsc -b --force
      - run: npx eslint .
      - run: npm test
