name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check --output-format=github src tests
      - run: uv run complexipy src tests
      - run: uv run mypy
      - run: uv run pytest -q
